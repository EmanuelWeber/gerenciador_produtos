<div class="form-container">
  <button type="button" class="btn-back" (click)="voltar()">
    < </button>
      <h2 class="form-title">{{ produtoSelecionado.id! ? 'Editar' : 'Adicionar' }} Produto</h2>
      <form (ngSubmit)="adicionarOuEditarProduto()" class="product-form">
        <div class="form-group">
          <label for="nome">Nome</label>
          <input id="nome" type="text" placeholder="Digite o nome do produto" [(ngModel)]="produtoSelecionado.nome"
            name="nome" required />
        </div>

        <div class="form-group">
          <label for="quantidade">Quantidade</label>
          <input id="quantidade" type="number" placeholder="Digite a quantidade"
            [(ngModel)]="produtoSelecionado.quantidade" name="quantidade" required min="1" />
        </div>

        <div class="form-group">
          <label for="categoria">Categoria</label>
          <select id="categoria" name="categoria" required [(ngModel)]="produtoSelecionado.idCategoria">
            <option value=0 disabled selected hidden>Selecione a categoria</option>
            <option *ngFor="let cat of categorias" [ngValue]="cat.id">
              {{ cat.nome }}
            </option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            {{ produtoSelecionado.id! ? 'Salvar' : 'Adicionar' }}
          </button>
        </div>
      </form>
</div>
